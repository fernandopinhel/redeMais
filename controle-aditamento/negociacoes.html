<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0e6b57">
    <meta name="description" content="Negociações de aditivos com a rede, listadas e não listadas.">
    <title>Negociações | Orla Placar</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@500;600&amp;display=swap">
    <link rel="stylesheet" href="../ds/ds.css">
    <link rel="stylesheet" href="css/app.css">
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <header class="app-header"></header>

    <main class="content" id="conteudo" tabindex="-1">
      <div class="page-head">
        <div class="page-head__text">
          <span class="eyebrow"><svg class="icon" aria-hidden="true" focusable="false"><use href="../ds/icons.svg#i-handshake"/></svg> Negociações</span>
          <h1>Negociações com a rede</h1>
          <p>Itens listados seguem a tabela de referência. Os não listados são negociados caso a caso.</p>
        </div>
        <div class="page-head__actions">
          <button class="btn" type="button" id="exportar"><svg class="icon" aria-hidden="true" focusable="false"><use href="../ds/icons.svg#i-download"/></svg> Exportar CSV</button>
          <button class="btn btn--primary" type="button" id="nova"><svg class="icon" aria-hidden="true" focusable="false"><use href="../ds/icons.svg#i-plus"/></svg> Abrir negociação</button>
        </div>
      </div>

      <form class="card filters" id="filtros" novalidate aria-labelledby="filtros-titulo">
        <h2 class="visually-hidden" id="filtros-titulo">Filtros</h2>
        <fieldset class="segmented">
          <legend>Itens</legend>
          <label><input type="radio" name="lista" value="todos" checked> Todos</label>
          <label><input type="radio" name="lista" value="listados"> Listados</label>
          <label><input type="radio" name="lista" value="nao-listados"> Não listados</label>
        </fieldset>
        <div class="form-grid">
          <div class="field span-4">
            <label for="f-busca">Prestador ou grupo</label>
            <input class="input" id="f-busca" name="busca" type="search" autocomplete="off" placeholder="Nome, código ou grupo">
          </div>
          <div class="field span-2">
            <label for="f-tipo">Tipo de aditivo</label>
            <select class="select" id="f-tipo" name="tipo"></select>
          </div>
          <div class="field span-2">
            <label for="f-sucursal">Sucursal</label>
            <select class="select" id="f-sucursal" name="sucursal"></select>
          </div>
          <div class="field span-2">
            <label for="f-status">Status</label>
            <select class="select" id="f-status" name="status"></select>
          </div>
          <div class="field span-2">
            <label for="f-resp">Responsável</label>
            <select class="select" id="f-resp" name="responsavel"></select>
          </div>
        </div>
        <div class="filters__actions filters__actions--split">
          <label class="switch"><input type="checkbox" name="paradas"> Só as paradas há mais de 30 dias</label>
          <div class="btn-row">
            <button class="btn" type="button" id="limpar">Limpar filtros</button>
            <button class="btn btn--primary" type="submit"><svg class="icon" aria-hidden="true" focusable="false"><use href="../ds/icons.svg#i-search"/></svg> Filtrar</button>
          </div>
        </div>
      </form>

      <section class="card" aria-labelledby="resultado-titulo">
        <div class="card__head">
          <div>
            <h2 id="resultado-titulo">Resultado</h2>
            <p id="resultado-info" aria-live="polite"></p>
          </div>
        </div>
        <div id="resultado"></div>
      </section>
    </main>

    <footer class="app-foot"></footer>

    <script src="../ds/ds.js"></script>
    <script src="../shared/rede.js"></script>
    <script src="js/app.js"></script>
    <script src="js/negociacoes.js"></script>
  </body>
</html>
